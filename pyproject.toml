[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-deliverables"
version = "0.1.0"
description = "Low-pT tau -> 3pi track finding: three-stage cascade (prefilter + ParT reranker + couple reranker)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Oleh Prostakov", email = "prostakov.oleh@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.26,<2.0",
    "awkward>=2.6",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=7"]
condor = ["uproot>=5"]

[tool.setuptools]
py-modules = ["train_prefilter", "train_cascade"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "weaver*", "networks*"]
exclude = ["tests*", "condor*", "data*"]
