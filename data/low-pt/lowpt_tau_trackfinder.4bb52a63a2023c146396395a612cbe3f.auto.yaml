new_variables:
  track_mask: ak.ones_like(track_eta)
  track_px: track_pt * np.cos(track_phi)
  track_py: track_pt * np.sin(track_phi)
  track_pz: track_pt * np.sinh(track_eta)
  track_energy: np.sqrt(track_px**2 + track_py**2 + track_pz**2 + 0.13957**2)
  track_log_dz_significance: np.sign(track_dz_significance) * np.log1p(np.abs(track_dz_significance))
  track_log_norm_chi2: np.log1p(track_norm_chi2)
  track_log_pt_error: np.log(np.maximum(track_pt_error, 1e-12))
  track_log_covariance_phi_phi: np.log(np.maximum(track_covariance_phi_phi, 1e-12))
  track_log_covariance_lambda_lambda: np.log(np.maximum(track_covariance_lambda_lambda,
    1e-12))
  track_log_pt: np.log(track_pt + 1e-6)
  track_log_relative_pt_error: np.log(np.maximum(track_pt_error / (track_pt + 1e-6),
    1e-12))
  track_eta_raw: track_eta
  track_phi_raw: track_phi
  track_px_raw: track_px
  track_py_raw: track_py
  track_pz_raw: track_pz
  track_absolute_dxy: np.abs(track_dxy)
  track_absolute_dz: np.abs(track_dz)
  track_log_covariance_dxy_dxy: np.log(np.maximum(track_covariance_dxy_dxy, 1e-30))
  track_log_covariance_dsz_dsz: np.log(np.maximum(track_covariance_dsz_dsz, 1e-30))
  track_log_absolute_covariance_dxy_dsz: np.log(np.abs(track_covariance_dxy_dsz) +
    1e-30)
  track_log_absolute_covariance_phi_dxy: np.log(np.abs(track_covariance_phi_dxy) +
    1e-30)
  track_global_z: event_primary_vertex_z + track_dz
  track_pileup_min_gap: ak.min(np.abs(track_global_z[:, :, np.newaxis] - event_other_pv_z[:,
    np.newaxis, :]), axis=-1)
  track_closer_to_other_pv: (track_pileup_min_gap < np.abs(track_dz)) * 1.0
  track_n_pvs: event_n_pvs * ak.ones_like(track_eta)
  track_muon_min_delta_r: ak.min(np.sqrt((track_eta[:, :, np.newaxis] - muon_eta[muon_soft_id
    == 1][:, np.newaxis, :])**2 + (np.mod(track_phi[:, :, np.newaxis] - muon_phi[muon_soft_id
    == 1][:, np.newaxis, :] + np.pi, 2*np.pi) - np.pi)**2), axis=-1)
  track_muon_min_dz_gap: ak.min(np.abs(track_dz[:, :, np.newaxis] - muon_dz[muon_soft_id
    == 1][:, np.newaxis, :]), axis=-1)
  track_has_soft_muon: (ak.sum(muon_soft_id == 1, axis=1) > 0) * ak.ones_like(track_eta)
  track_direction_x: np.cos(track_phi) / np.cosh(track_eta)
  track_direction_y: np.sin(track_phi) / np.cosh(track_eta)
  track_direction_z: np.tanh(track_eta)
  track_sv_min_line_distance: ak.min(np.sqrt(((sv_y[:, np.newaxis, :] - track_vertex_y[:,
    :, np.newaxis]) * track_direction_z[:, :, np.newaxis] - (sv_z[:, np.newaxis, :]
    - track_vertex_z[:, :, np.newaxis]) * track_direction_y[:, :, np.newaxis])**2
    + ((sv_z[:, np.newaxis, :] - track_vertex_z[:, :, np.newaxis]) * track_direction_x[:,
    :, np.newaxis] - (sv_x[:, np.newaxis, :] - track_vertex_x[:, :, np.newaxis]) *
    track_direction_z[:, :, np.newaxis])**2 + ((sv_x[:, np.newaxis, :] - track_vertex_x[:,
    :, np.newaxis]) * track_direction_y[:, :, np.newaxis] - (sv_y[:, np.newaxis, :]
    - track_vertex_y[:, :, np.newaxis]) * track_direction_x[:, :, np.newaxis])**2),
    axis=-1)
  track_has_sv: (ak.num(sv_x, axis=1) > 0) * ak.ones_like(track_eta)
  track_pv_line_distance_3d: np.sqrt(((event_primary_vertex_y - track_vertex_y) *
    track_direction_z - (event_primary_vertex_z - track_vertex_z) * track_direction_y)**2
    + ((event_primary_vertex_z - track_vertex_z) * track_direction_x - (event_primary_vertex_x
    - track_vertex_x) * track_direction_z)**2 + ((event_primary_vertex_x - track_vertex_x)
    * track_direction_y - (event_primary_vertex_y - track_vertex_y) * track_direction_x)**2)
  track_nearest_other_pv_index: ak.argmin(np.abs(track_global_z[:, :, np.newaxis]
    - event_other_pv_z[:, np.newaxis, :]), axis=-1) * 1.0
  track_pca_parameter: (event_primary_vertex_x - track_vertex_x) * np.cos(track_phi)
    + (event_primary_vertex_y - track_vertex_y) * np.sin(track_phi)
  track_lifetime_disp_x: track_vertex_x - event_primary_vertex_x + track_pca_parameter
    * np.cos(track_phi)
  track_lifetime_disp_y: track_vertex_y - event_primary_vertex_y + track_pca_parameter
    * np.sin(track_phi)
  track_primary_vertex_x: event_primary_vertex_x * ak.ones_like(track_eta)
  track_primary_vertex_y: event_primary_vertex_y * ak.ones_like(track_eta)
  track_sv0_x: ak.fill_none(ak.pad_none(sv_x, 3, clip=True), 10000.0)[:, 0] * ak.ones_like(track_eta)
  track_sv0_y: ak.fill_none(ak.pad_none(sv_y, 3, clip=True), 10000.0)[:, 0] * ak.ones_like(track_eta)
  track_sv0_z: ak.fill_none(ak.pad_none(sv_z, 3, clip=True), 10000.0)[:, 0] * ak.ones_like(track_eta)
  track_sv0_dlen_sig: ak.fill_none(ak.pad_none(sv_dlen_sig, 3, clip=True), 0.0)[:,
    0] * ak.ones_like(track_eta)
  track_sv0_mass: ak.fill_none(ak.pad_none(sv_mass, 3, clip=True), 0.0)[:, 0] * ak.ones_like(track_eta)
  track_sv1_x: ak.fill_none(ak.pad_none(sv_x, 3, clip=True), 10000.0)[:, 1] * ak.ones_like(track_eta)
  track_sv1_y: ak.fill_none(ak.pad_none(sv_y, 3, clip=True), 10000.0)[:, 1] * ak.ones_like(track_eta)
  track_sv1_z: ak.fill_none(ak.pad_none(sv_z, 3, clip=True), 10000.0)[:, 1] * ak.ones_like(track_eta)
  track_sv1_dlen_sig: ak.fill_none(ak.pad_none(sv_dlen_sig, 3, clip=True), 0.0)[:,
    1] * ak.ones_like(track_eta)
  track_sv1_mass: ak.fill_none(ak.pad_none(sv_mass, 3, clip=True), 0.0)[:, 1] * ak.ones_like(track_eta)
  track_sv2_x: ak.fill_none(ak.pad_none(sv_x, 3, clip=True), 10000.0)[:, 2] * ak.ones_like(track_eta)
  track_sv2_y: ak.fill_none(ak.pad_none(sv_y, 3, clip=True), 10000.0)[:, 2] * ak.ones_like(track_eta)
  track_sv2_z: ak.fill_none(ak.pad_none(sv_z, 3, clip=True), 10000.0)[:, 2] * ak.ones_like(track_eta)
  track_sv2_dlen_sig: ak.fill_none(ak.pad_none(sv_dlen_sig, 3, clip=True), 0.0)[:,
    2] * ak.ones_like(track_eta)
  track_sv2_mass: ak.fill_none(ak.pad_none(sv_mass, 3, clip=True), 0.0)[:, 2] * ak.ones_like(track_eta)
  dummy_label: np.ones_like(event_n_tracks, dtype='float32')
