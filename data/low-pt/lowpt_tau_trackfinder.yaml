selection:
   ### Filter out events with 0 tracks — they cause NaN in FPS/kNN/max-pool.
   event_n_tracks > 0

new_variables:
   track_mask: ak.ones_like(track_eta)
   track_px: track_pt * np.cos(track_phi)
   track_py: track_pt * np.sin(track_phi)
   track_pz: track_pt * np.sinh(track_eta)
   ### Assumed pion mass: E = sqrt(px^2 + py^2 + pz^2 + m_pi^2), m_pi = 0.13957 GeV
   track_energy: np.sqrt(track_px**2 + track_py**2 + track_pz**2 + 0.13957**2)
   ###
   ### Log-transformed features: compress heavy-tailed distributions that
   ### auto-standardization clips (dz_sig: 99.9% clipped, covs: scale >7000).
   ### sign(x) * log(1 + |x|) for signed quantities, log(1 + x) for positive.
   track_log_dz_significance: np.sign(track_dz_significance) * np.log1p(np.abs(track_dz_significance))
   ### log(x) not log1p(x): pt_error values are ~0.01, log1p(0.01)≈0.01 (no spread)
   ### chi2/ndof: ≈1 for real tracks, >>1 for fakes.
   ### Using log1p (not log+eps) so padding zeros map to 0 instead of -13.8.
   ### Real tracks: log1p(1) = 0.69, log1p(10) = 2.40. Clean separation from padding at 0.
   track_log_norm_chi2: np.log1p(track_norm_chi2)
   ### np.maximum clamps non-positive values (zeros from padding, rare negatives
   ### from numerical noise in covariance fits) to 1e-12 before log.
   track_log_pt_error: np.log(np.maximum(track_pt_error, 1e-12))
   track_log_covariance_phi_phi: np.log(np.maximum(track_covariance_phi_phi, 1e-12))
   track_log_covariance_lambda_lambda: np.log(np.maximum(track_covariance_lambda_lambda, 1e-12))
   ###
   ### Derived features: standard in CMS/ATLAS taggers (DeepJet, DeepTau, GN2)
   track_log_pt: np.log(track_pt + 1e-6)
   track_log_relative_pt_error: np.log(np.maximum(track_pt_error / (track_pt + 1e-6), 1e-12))
   ###
   ### Raw aliases: avoid parameter collision between standardized and raw copies
   track_eta_raw: track_eta
   track_phi_raw: track_phi
   track_px_raw: track_px
   track_py_raw: track_py
   track_pz_raw: track_pz
   ###
   ### H6 extension — raw impact-parameter magnitudes (PV-referenced, cm) and
   ### the live covariance block (lambda_dxy/qop_dxy are identically zero in
   ### the source and stay excluded).
   track_absolute_dxy: np.abs(track_dxy)
   track_absolute_dz: np.abs(track_dz)
   track_log_covariance_dxy_dxy: np.log(np.maximum(track_covariance_dxy_dxy, 1e-30))
   track_log_covariance_dsz_dsz: np.log(np.maximum(track_covariance_dsz_dsz, 1e-30))
   track_log_absolute_covariance_dxy_dsz: np.log(np.abs(track_covariance_dxy_dsz) + 1e-30)
   track_log_absolute_covariance_phi_dxy: np.log(np.abs(track_covariance_phi_dxy) + 1e-30)
   ###
   ### H6 extension — vertex re-association: the stored PV is not the tau
   ### vertex in ~68% of events, so the OtherPV z list carries the true
   ### collision vertex more often than not.
   track_global_z: event_primary_vertex_z + track_dz
   track_pileup_min_gap: ak.min(np.abs(track_global_z[:, :, np.newaxis] - event_other_pv_z[:, np.newaxis, :]), axis=-1)
   track_closer_to_other_pv: (track_pileup_min_gap < np.abs(track_dz)) * 1.0
   track_n_pvs: event_n_pvs * ak.ones_like(track_eta)
   ###
   ### H6 extension — soft-muon relations (other-tau tag). Empty reductions
   ### yield None: dropped by the auto-standardizer, filled with the
   ### post-standardization median (0) at padding time; the has_* flags let
   ### the model distinguish "missing" from "median".
   track_muon_min_delta_r: ak.min(np.sqrt((track_eta[:, :, np.newaxis] - muon_eta[muon_soft_id == 1][:, np.newaxis, :])**2 + (np.mod(track_phi[:, :, np.newaxis] - muon_phi[muon_soft_id == 1][:, np.newaxis, :] + np.pi, 2*np.pi) - np.pi)**2), axis=-1)
   track_muon_min_dz_gap: ak.min(np.abs(track_dz[:, :, np.newaxis] - muon_dz[muon_soft_id == 1][:, np.newaxis, :]), axis=-1)
   track_has_soft_muon: (ak.sum(muon_soft_id == 1, axis=1) > 0) * ak.ones_like(track_eta)
   ###
   ### H6 extension — linearized-track geometry: 3D line distance to the
   ### nearest secondary vertex and to the stored PV.
   track_direction_x: np.cos(track_phi) / np.cosh(track_eta)
   track_direction_y: np.sin(track_phi) / np.cosh(track_eta)
   track_direction_z: np.tanh(track_eta)
   track_sv_min_line_distance: ak.min(np.sqrt(((sv_y[:, np.newaxis, :] - track_vertex_y[:, :, np.newaxis]) * track_direction_z[:, :, np.newaxis] - (sv_z[:, np.newaxis, :] - track_vertex_z[:, :, np.newaxis]) * track_direction_y[:, :, np.newaxis])**2 + ((sv_z[:, np.newaxis, :] - track_vertex_z[:, :, np.newaxis]) * track_direction_x[:, :, np.newaxis] - (sv_x[:, np.newaxis, :] - track_vertex_x[:, :, np.newaxis]) * track_direction_z[:, :, np.newaxis])**2 + ((sv_x[:, np.newaxis, :] - track_vertex_x[:, :, np.newaxis]) * track_direction_y[:, :, np.newaxis] - (sv_y[:, np.newaxis, :] - track_vertex_y[:, :, np.newaxis]) * track_direction_x[:, :, np.newaxis])**2), axis=-1)
   track_has_sv: (ak.num(sv_x, axis=1) > 0) * ak.ones_like(track_eta)
   track_pv_line_distance_3d: np.sqrt(((event_primary_vertex_y - track_vertex_y) * track_direction_z - (event_primary_vertex_z - track_vertex_z) * track_direction_y)**2 + ((event_primary_vertex_z - track_vertex_z) * track_direction_x - (event_primary_vertex_x - track_vertex_x) * track_direction_z)**2 + ((event_primary_vertex_x - track_vertex_x) * track_direction_y - (event_primary_vertex_y - track_vertex_y) * track_direction_x)**2)
   ###
   ### Dummy label for weaver compatibility (actual loss uses per-track labels)
   dummy_label: np.ones_like(event_n_tracks, dtype='float32')

preprocess:
  method: auto
  data_fraction: 0.5

inputs:
   pf_points:
      length: 2100
      pad_mode: constant
      vars:
         - [track_eta_raw, null]
         - [track_phi_raw, null]
   pf_features:
      length: 2100
      pad_mode: constant
      vars:
         ### Kinematic features
         - track_px
         - track_py
         - track_pz
         - track_eta
         - track_phi
         - track_charge
         ### Displacement features
         - track_dxy_significance
         ### Log-transformed dz significance: raw has std=488, auto-standardization
         ### clips 99.9% of values. sign(x)*log(1+|x|) preserves full dynamic range.
         - track_log_dz_significance
         ### Track fit quality: log(chi2/ndof). ≈0 for real tracks, >>0 for fakes.
         ### #1 CMS track quality discriminator across all generations.
         - track_log_norm_chi2
         ### Track measurement quality (log-transformed to compress tails)
         - track_log_pt_error
         - track_n_valid_pixel_hits
         ### 3D displacement (complements 2D dxy_significance)
         - track_dca_significance
         ### Helix fit precision (log-transformed: raw scales are 7530 and 86704)
         - track_log_covariance_phi_phi
         - track_log_covariance_lambda_lambda
         ### Derived features (standard in CMS/ATLAS taggers)
         - track_log_pt
         - track_log_relative_pt_error
         ### H6 extension (appended AFTER the legacy 16 — channel order
         ### 0-15 is load-bearing for the later cascade stages)
         - track_absolute_dxy
         - track_absolute_dz
         - track_log_covariance_dxy_dxy
         - track_log_covariance_dsz_dsz
         - track_log_absolute_covariance_dxy_dsz
         - track_log_absolute_covariance_phi_dxy
         - track_n_valid_hits
         - track_pileup_min_gap
         - [track_closer_to_other_pv, null]
         - track_n_pvs
         - track_muon_min_delta_r
         - track_muon_min_dz_gap
         - [track_has_soft_muon, null]
         - track_sv_min_line_distance
         - [track_has_sv, null]
         - track_pv_line_distance_3d
   pf_vectors:
      length: 2100
      pad_mode: constant
      vars:
         - [track_px_raw, null]
         - [track_py_raw, null]
         - [track_pz_raw, null]
         - [track_energy, null]
   pf_mask:
      length: 2100
      pad_mode: constant
      vars:
         - [track_mask, null]
   pf_label:
      length: 2100
      pad_mode: constant
      vars:
         ### Per-track binary label: 1.0 = tau-origin pion, 0.0 = background/padding.
         ### [var_name, null] bypasses standardization — labels must stay as 0/1.
         - [track_label_from_tau, null]

labels:
   ### Dummy label for weaver compatibility. The actual loss uses pf_label
   ### (per-track labels loaded as an input group above).
   type: simple
   value: [dummy_label]

observers:
   - event_n_tracks
   - event_run
   - event_id
   - event_luminosity_block
   - source_batch_id
   - source_microbatch_id

weights:
